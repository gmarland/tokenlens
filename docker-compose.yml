services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tokenlens
      POSTGRES_PASSWORD: tokenlens
      POSTGRES_DB: tokenlens
    ports: ["5432:5432"]
    volumes: [tokenlens_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenlens"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  tokenlens_pg:
