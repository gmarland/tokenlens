services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tokenlens
      POSTGRES_PASSWORD: tokenlens
      POSTGRES_DB: tokenlens
    ports: ["5432:5432"]
    volumes: [tokenlens_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenlens"]
      interval: 2s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  tokenlens_pg:
